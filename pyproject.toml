[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sgbm"
version = "0.0.0"
description = "Sistema de Gestión de Bibliografías de Materias — UAA GPI Curso 318"
requires-python = ">=3.14"
dependencies = [
    # Versión exacta: Flet aún no es 1.0 y rompe API entre versiones menores
    "flet==0.86.4",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
